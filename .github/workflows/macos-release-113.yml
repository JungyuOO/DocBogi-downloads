name: macOS 1.1.3 Universal installer (manual)

on:
  workflow_dispatch:
    inputs:
      draft_release_id:
        description: Numeric ID of the distribution repository's v1.1.3 draft
        required: true
        type: string
      windows_setup_asset_id:
        description: Numeric ID of DocBogi-Setup-1.1.3-x64.exe in that draft
        required: true
        type: string
      windows_setup_sha256:
        description: Verified SHA-256 of the exact Windows Setup donor
        required: true
        type: string
      dist_tree_sha256:
        description: Independently approved canonical tree SHA-256 of the compiled dist
        required: true
        type: string

# Draft release asset downloads require a token with release write visibility.
# The token is scoped to the download step and checkout stores no credentials.
permissions:
  contents: write

jobs:
  macos:
    if: github.ref == 'refs/heads/main'
    name: Build and verify Universal macOS DMG
    runs-on: macos-15
    timeout-minutes: 26
    steps:
      - name: Check out distribution tooling without storing credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use pinned Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.1

      - name: Fetch the exact Windows donor from the verified draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DRAFT_ID: ${{ inputs.draft_release_id }}
          WIN_ASSET_ID: ${{ inputs.windows_setup_asset_id }}
          WIN_SHA: ${{ inputs.windows_setup_sha256 }}
          DIST_SHA: ${{ inputs.dist_tree_sha256 }}
        run: |
          set -euo pipefail
          [[ "$DRAFT_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$WIN_ASSET_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          test "$WIN_SHA" = fe9a3eaf1daf379c36acbaaf711799f6084642194f036d4bf4cfff3f5d0d4d16
          test "$DIST_SHA" = 36472b4e0a929e6ca15cddfb031d1b3f1ddd7ccc81e6b4758776ce83c8d545ea
          work=$(mktemp -d "$(cd "$RUNNER_TEMP" && pwd -P)/docbogi-113.XXXXXXXX")
          endpoint="repos/$GITHUB_REPOSITORY/releases"
          gh api "$endpoint/$DRAFT_ID" --jq 'select(.draft and .tag_name=="v1.1.3") | .id' > "$work/draft-id"
          test "$(cat "$work/draft-id")" = "$DRAFT_ID"
          gh api "$endpoint/$DRAFT_ID/assets?per_page=100" > "$work/assets.json"
          python3 - "$work/assets.json" <<'PY'
          import json, os, sys
          with open(sys.argv[1], encoding="utf-8") as stream:
              assets = json.load(stream)
          selected = [asset for asset in assets if str(asset["id"]) == os.environ["WIN_ASSET_ID"]]
          assert len(selected) == 1, "Asset does not belong to the expected draft"
          asset = selected[0]
          assert asset["name"] == "DocBogi-Setup-1.1.3-x64.exe", "Wrong Windows release asset"
          assert asset["state"] == "uploaded" and asset["size"] == 119305699, "Donor is unavailable or has the wrong size"
          assert asset.get("digest") == "sha256:" + os.environ["WIN_SHA"], "Unexpected release asset digest"
          PY
          gh api -H 'Accept: application/octet-stream' "$endpoint/assets/$WIN_ASSET_ID" > "$work/windows-setup.exe"
          printf '%s  %s\n' "$WIN_SHA" "$work/windows-setup.exe" | shasum -a 256 -c -
          printf '%s\n' "DOCBOGI_MAC_RELEASE_WORK=$work" "DOCBOGI_APPROVED_DIST=$DIST_SHA" >> "$GITHUB_ENV"

      - name: Stage, sign, mount and exercise the macOS installer
        shell: bash
        run: |
          set -euo pipefail
          unset GH_TOKEN GITHUB_TOKEN
          work="$DOCBOGI_MAC_RELEASE_WORK"
          base_mount="$work/base-mounted"
          final_mount="$work/final-mounted"
          volume="$work/volume"
          output="$GITHUB_WORKSPACE/release-output"
          installer="$output/DocBogi-1.1.3-mac-universal.dmg"
          base_attached=false
          final_attached=false
          cleanup() {
            if "$final_attached"; then hdiutil detach "$final_mount" || true; fi
            if "$base_attached"; then hdiutil detach "$base_mount" || true; fi
          }
          trap cleanup EXIT
          mkdir "$base_mount" "$final_mount" "$volume" "$output"

          curl --fail --show-error --silent --location --retry 3 \
            --output "$work/base.dmg" \
            https://github.com/JungyuOO/DocBogi-downloads/releases/download/v1.1.2/Docvia-1.1.2-mac-universal.dmg
          printf '%s  %s\n' 4808abf59fe35cbe0f1bfcb4c475c71aa7f7dc772cc42c28cb4bb0d26fccd691 "$work/base.dmg" |
            shasum -a 256 -c -
          hdiutil verify "$work/base.dmg"
          hdiutil attach -readonly -nobrowse -mountpoint "$base_mount" "$work/base.dmg"
          base_attached=true
          codesign --verify --deep --strict "$base_mount/Docvia.app"
          ditto "$base_mount/Docvia.app" "$volume/Docvia.app"

          if ! command -v 7zz >/dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install sevenzip
          fi
          archiver="$(command -v 7zz)"
          python3 release-tools/install_macos_payload_113.py stage \
            --app "$volume/Docvia.app" --donor "$work/windows-setup.exe" \
            --expected-dist "$DOCBOGI_APPROVED_DIST" --work "$work" --archiver "$archiver"

          ln -s /Applications "$volume/Applications"
          hdiutil create -fs HFS+ -format UDZO -volname DocBogi -srcfolder "$volume" "$installer"
          hdiutil verify "$installer"
          hdiutil attach -readonly -nobrowse -mountpoint "$final_mount" "$installer"
          final_attached=true

          bundle="$final_mount/DocBogi.app"
          test "$(readlink "$final_mount/Applications")" = /Applications
          test ! -e "$final_mount/Docvia.app"
          python3 release-tools/install_macos_payload_113.py verify \
            --app "$bundle" --work "$work" --expected-dist "$DOCBOGI_APPROVED_DIST"
          npm install --prefix "$work/qa-deps" --registry https://registry.npmjs.org \
            --no-audit --no-fund --ignore-scripts --save-exact playwright-core@1.65.0
          node release-tools/verify_macos_113.cjs "$base_mount/Docvia.app" "$bundle" "$work" \
            "$work/qa-deps/node_modules/playwright-core"
          hdiutil detach "$final_mount"
          final_attached=false
          hdiutil detach "$base_mount"
          base_attached=false
          shasum -a 256 "$installer"

      - name: Upload the verified Universal installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docbogi-macos-universal-1.1.3
          path: release-output/DocBogi-1.1.3-mac-universal.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
