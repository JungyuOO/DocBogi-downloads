name: macOS 1.0.9 installer patch (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: Patch and verify universal DMG
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out public release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.22.1
      - name: Apply verified renderer delta and verify mounted installer
        shell: bash
        run: |
          set -euo pipefail
          work=$(cd "$RUNNER_TEMP" && pwd -P)
          work=$(mktemp -d "$work/docvia-109.XXXXXXXX")
          base_mount="$work/base-mounted"
          final_mount="$work/final-mounted"
          volume="$work/volume"
          output="$GITHUB_WORKSPACE/release-output"
          installer="$output/Docvia-1.0.9-mac-universal.dmg"
          base_attached=false
          final_attached=false
          cleanup() {
            if "$final_attached"; then hdiutil detach "$final_mount" || true; fi
            if "$base_attached"; then hdiutil detach "$base_mount" || true; fi
          }
          trap cleanup EXIT
          mkdir "$base_mount" "$final_mount" "$volume" "$output"

          curl --fail --show-error --silent --location --retry 3 \
            --output "$work/base.dmg" \
            https://github.com/JungyuOO/Docvia-downloads/releases/download/v1.0.8/Docvia-1.0.8-mac-universal.dmg
          (
            cd "$work"
            printf '%s  %s\n' 53c49f8b4e295d3d65b09d2f77501ff312148931899e4850dece20eff1b6a9ef base.dmg |
              shasum -a 256 -c -
          )
          hdiutil verify "$work/base.dmg"
          hdiutil attach -readonly -nobrowse -mountpoint "$base_mount" "$work/base.dmg"
          base_attached=true
          ditto "$base_mount/Docvia.app" "$volume/Docvia.app"
          hdiutil detach "$base_mount"
          base_attached=false

          python3 release-tools/patch_macos.py "$volume/Docvia.app" --fixtures "$work/fixtures"
          ln -s /Applications "$volume/Applications"
          hdiutil create -fs HFS+ -format UDZO -volname Docvia -srcfolder "$volume" "$installer"
          hdiutil verify "$installer"
          hdiutil attach -readonly -nobrowse -mountpoint "$final_mount" "$installer"
          final_attached=true

          bundle="$final_mount/Docvia.app"
          binary="$bundle/Contents/MacOS/Docvia"
          test "$(readlink "$final_mount/Applications")" = /Applications
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$bundle/Contents/Info.plist")" = 1.0.9
          archs=$(lipo -archs "$binary" | tr ' ' '\n' | sort | xargs)
          test "$archs" = 'arm64 x86_64'
          codesign --verify --deep --strict "$bundle"
          codesign --display --verbose=4 "$bundle" 2>&1 | grep -Fx 'Signature=adhoc'

          npm install --prefix "$work/qa-deps" --registry https://registry.npmjs.org \
            --no-audit --no-fund --ignore-scripts --save-exact playwright-core@1.65.0
          node release-tools/verify_macos.cjs "$binary" "$work" "$work/qa-deps/node_modules/playwright-core"
          hdiutil detach "$final_mount"
          final_attached=false
          shasum -a 256 "$installer"
      - name: Upload verified macOS installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docvia-macos-universal
          path: release-output/Docvia-1.0.9-mac-universal.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
